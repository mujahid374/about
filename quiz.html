    <link rel="stylesheet" href="css/style.css">
    <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f8fc;
    }

    /* BLUE HEADER BOX */
    header {
        background-color: #0066cc;
        width: 100%;
        padding: 25px 20px;
        text-align: center;
    }

    /* MAIN TITLE */
    header h1 {
        color: white;
        font-size: 32px;
        margin-bottom: 20px;
    }

    /* NAVIGATION — SIDE BY SIDE */
    nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
    }

    nav a {
        color: white;
        text-decoration: none;
        background-color: #0052a3;
        padding: 12px 20px;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        transition: 0.3s;
    }

    nav a:hover {
        background-color: white;
        color: #0066cc;
    }

    /* MAIN CONTENT */
    main {
        max-width: 1000px;
        margin: 40px auto;
        padding: 20px;
        text-align: center;
    }

    main h2 {
        color: #0066cc;
        margin-bottom: 15px;
    }

    main p {
        font-size: 18px;
        line-height: 1.7;
        color: #333;
    }
 </style>
<script>
    function checkAnswer(correctAnswer) {
        const selected = document.querySelector('input[name="quiz"]:checked');
        const result = document.getElementById("result");

        if (!selected) {
            result.textContent = "Please select an answer first.";
            result.style.color = "orange";
            return;
        }

        if (selected.value === correctAnswer) {
            result.textContent = "Correct! 🎉";
            result.style.color = "green";
        } else {
            result.textContent = "Incorrect. Try again!";
            result.style.color = "red";
        }
    }
</script>
</head>

<body>

    <header>
        <nav class="navbar">

            <h1 class="logo">Human Reproductive System</h1>

            <ul class="nav-links">

                <li><a href="about.html">About</a></li>
                <li><a href="male.html">Male System</a></li>
                <li><a href="female.html">Female System</a></li>
                <li><a href="process.html">Reproduction</a></li>

                <li><a href="quiz.html" class="active">Quiz</a></li>
            </ul>

            <button id="menuButton">☰</button>

        </nav>
    </header>
    <div class="quiz">
    <h2>Quiz</h2>

    <p>Which organ produces sperm?</p>

    <label>
        <input type="radio" name="quiz" value="ovary">
        Ovary
    </label>

    <label>
        <input type="radio" name="quiz" value="testis">
        Testis
    </label>

    <label>
        <input type="radio" name="quiz" value="uterus">
        Uterus
    </label>

    <br><br>

    <button onclick="checkAnswer('testis')">Check Answer</button>

    <p id="result"></p>
</div>
    </main>
